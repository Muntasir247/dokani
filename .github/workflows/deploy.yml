name: Deployment Pipeline

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.dokani.app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Application Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}

      - name: Deploy to Staging Fleet
        run: |
          echo "Deploying release ${{ github.sha }} to staging.dokani.app..."
          # Deploy step to cloud provider (Vercel, Docker, AWS ECS, or Cloud Run)

      - name: Staging Smoke Health Check
        run: |
          echo "Running health check on staging..."
          # curl -f https://staging.dokani.app/api/health || exit 1

  deploy-production:
    name: Deploy to Production Environment (Requires Manual Approval)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dokani.app
    steps:
      - name: Checkout Tagged Release
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Production Dependencies
        run: npm ci

      - name: Run Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SERVICE_ROLE_KEY }}

      - name: Execute Zero-Downtime Migration Step
        run: |
          echo "Applying any pending production migrations..."

      - name: Deploy Production Canary / Fleet
        run: |
          echo "Deploying tagged release ${{ github.ref_name }} to production..."

      - name: Verify Production Health Check
        run: |
          echo "Verifying production health check..."
          # curl -f https://dokani.app/api/health || exit 1
